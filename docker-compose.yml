# version: '3.8'

services:
  pranajiva-backend:
    image: pranajiva-backend:latest
    container_name: pranajiva-backend
    ports:
      - "${PORT:-9001}:${PORT:-9001}"
    # can be removed for PROD Release - Remove default fallback values, use proper .env file
    environment:
      # JWT and Cookie Secrets
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      
      # Database Configuration
      DATABASE_TYPE: ${DATABASE_TYPE}
      DATABASE_URL: ${DATABASE_URL}

      # Redis Configuration
      REDIS_URL: ${REDIS_URL}

      # Port Configuration
      PORT: ${PORT}

      # Backend URL
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}

      # CORS Configuration
      ADMIN_CORS: ${ADMIN_CORS}
      STORE_CORS: ${STORE_CORS}

    restart: unless-stopped

    # can be removed for PROD Release - Health check adds curl dependency (extra bloat)
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:${PORT:-9001}/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
    
