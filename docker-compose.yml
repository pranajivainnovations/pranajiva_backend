# version: '3.8'

services:
  pranajiva-backend:
    image: pranajiva-backend:latest
    container_name: pranajiva-backend
    ports:
      - "${PORT:-9001}:${PORT:-9001}"
    # can be removed for PROD Release - Remove default fallback values, use proper .env file
    environment:
      # JWT and Cookie Secrets
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      
      # Database Configuration
      DATABASE_TYPE: ${DATABASE_TYPE}
      DATABASE_URL: ${DATABASE_URL}

      # Redis Configuration
      REDIS_URL: ${REDIS_URL}

      # Port Configuration
      PORT: ${PORT}

      # Backend URL
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}

      # CORS Configuration
      ADMIN_CORS: ${ADMIN_CORS}
      STORE_CORS: ${STORE_CORS}
      S3_URL: ${S3_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL}
      AI_IMAGE_COUNT: ${AI_IMAGE_COUNT}
      AI_IMAGE_WIDTH: ${AI_IMAGE_WIDTH}
      AI_IMAGE_HEIGHT: ${AI_IMAGE_HEIGHT}
      AI_IMAGE_QUALITY: ${AI_IMAGE_QUALITY}
      AI_STUDIO_S3_PREFIX: ${AI_STUDIO_S3_PREFIX}

      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VISION_PROVIDER: ${VISION_PROVIDER}
      VISION_MODEL: ${VISION_MODEL}


    restart: unless-stopped

    # can be removed for PROD Release - Health check adds curl dependency (extra bloat)
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://13.60.27.11:${PORT:-9001}/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
    
  pranajiva-storefront:    
    image: pranajiva-storefront:latest
    container_name: pranajiva-frontend
    ports:
      - "3000:3000"
    environment:
      # Runtime environment variables
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://13.60.27.11:9001}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-5ehhoj92}
      NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    restart: unless-stopped
    healthcheck:
      # test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://13.60.27.11:3000"]
      test: ["CMD", "curl", "-f", "http://13.60.27.11:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s