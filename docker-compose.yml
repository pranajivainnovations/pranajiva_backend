# version: '3.8'

services:
  pranajiva-backend:
    image: pranajiva-backend:latest
    container_name: pranajiva-backend
    ports:
      - "${PORT:-9001}:${PORT:-9001}"
    # can be removed for PROD Release - Remove default fallback values, use proper .env file
    environment:
      # JWT and Cookie Secrets
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

      # ── Browser notifications ───────────────────────────────────────────────
      # The reminder drain (src/jobs/send-reminders.ts) signs its own pushes, so
      # the backend needs BOTH halves of the VAPID pair — unlike the storefront,
      # which only needs the public key so a browser can subscribe.
      #
      # Same pair as OPS. Leave unset and reminders are still created, queued and
      # shown on the Coming up list; only the notification does not go out.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@crossfriend.in}

      # Baker Portal — signs baker_session tokens. MUST be a different value from JWT_SECRET and
      # from OPS's SESSION_SECRET: separation of the customer / OPS / baker identities is enforced
      # by these keys being distinct, not by cookie or route naming. Without it, every baker login
      # and account activation fails at the moment the token is minted.
      BAKER_SESSION_SECRET: ${BAKER_SESSION_SECRET}

      # Proves a caller is the OPS application (service-to-service only, never a user identity).
      # Must match OPS_SERVICE_KEY in crossfriend-ops, or issuing baker invites returns 401.
      OPS_SERVICE_KEY: ${OPS_SERVICE_KEY}
      
      # Database Configuration
      DATABASE_TYPE: ${DATABASE_TYPE}
      DATABASE_URL: ${DATABASE_URL}

      # Redis Configuration
      REDIS_URL: ${REDIS_URL}

      # Port Configuration
      PORT: ${PORT}

      # Backend URL
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}

      # CORS Configuration
      ADMIN_CORS: ${ADMIN_CORS}
      STORE_CORS: ${STORE_CORS}
      S3_URL: ${S3_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL}
      AI_IMAGE_COUNT: ${AI_IMAGE_COUNT}
      AI_IMAGE_WIDTH: ${AI_IMAGE_WIDTH}
      AI_IMAGE_HEIGHT: ${AI_IMAGE_HEIGHT}
      AI_IMAGE_QUALITY: ${AI_IMAGE_QUALITY}
      AI_STUDIO_S3_PREFIX: ${AI_STUDIO_S3_PREFIX}

      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VISION_PROVIDER: ${VISION_PROVIDER}
      VISION_MODEL: ${VISION_MODEL}

      # ── SMS / OTP (MSG91 SendOTP V5) ────────────────────────────────────────
      # Runtime variables, which is why they belong here rather than as build
      # args in the Dockerfile: the OTP routes read process.env when a request
      # arrives, so a value set here takes effect on `docker compose up -d` with
      # no rebuild. (The mirror of the NEXT_PUBLIC_* rule on the storefront,
      # where the opposite is true and a value set here would be ignored.)
      #
      # Note the failure mode this pairing has: compose substitutes an ABSENT
      # ${VAR} with an empty string and still sets the variable, so a container
      # can have MSG91_AUTH_KEY "present" and unusable. Both consumers below
      # fail closed on empty rather than proceeding, which is what turns that
      # into a visible 503 instead of a silently broken login.
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}

      # sendotp = MSG91 generates, stores and verifies the code (current).
      # legacy  = we generate it and MSG91 is only a transport; needs
      #           OTP_HASH_SECRET. Rollback path, switchable without a deploy.
      MSG91_OTP_MODE: ${MSG91_OTP_MODE:-sendotp}

      # Only read when MSG91_OTP_MODE=legacy.
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}


    restart: unless-stopped

    # can be removed for PROD Release - Health check adds curl dependency (extra bloat)
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://13.60.27.11:${PORT:-9001}/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
    
  pranajiva-storefront:    
    image: pranajiva-storefront:latest
    container_name: pranajiva-frontend
    ports:
      - "3000:3000"
    environment:
      # Runtime environment variables
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://13.60.27.11:9001}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-5ehhoj92}
      NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    restart: unless-stopped
    healthcheck:
      # test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://13.60.27.11:3000"]
      test: ["CMD", "curl", "-f", "http://13.60.27.11:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s